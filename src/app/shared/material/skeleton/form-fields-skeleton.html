@for (i of countArray; track $index) {
  <mat-form-field class="mat-form-field-disabled" floatLabel="always">
    @if (placeholder) {
      <mat-label>{{ placeholder }}</mat-label>
    }
    <div matPrefix>
      <ng-content select="[matPrefix]"></ng-content>
    </div>
    <input matInput hidden />
    <ion-skeleton-text [style.width]="width"></ion-skeleton-text>
  </mat-form-field>
}
