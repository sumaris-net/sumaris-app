<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>

    <ion-title>Rules Table</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <app-rules-table
    #table1
    [canEdit]="enabled"
    [canDelete]="enabled"
    [showToolbar]="false"
    [showSelectColumn]="false"
    [showIdColumn]="false"
    [allowEmpty]="false"
    [sticky]="true"
  ></app-rules-table>
</ion-content>
