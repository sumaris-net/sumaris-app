@if (showToolbar) {
  @if (!modal) {
    <app-toolbar [defaultBackHref]="$defaultBackHref | async" canGoBack="false">
      <ion-title [innerHTML]="$title | async"></ion-title>

      <ion-buttons slot="end">
        <!-- Refresh -->
        <ion-button *ngIf="uuid | isNilOrBlank" (click)="onRefresh.emit()" [title]="'COMMON.BTN_REFRESH' | translate">
          <mat-icon>refresh</mat-icon>
        </ion-button>

        <!-- Help button -->
        <ion-button (click)="reveal.toggleHelp()">
          <mat-icon>help_outline</mat-icon>
        </ion-button>

        <!-- Print -->
        <!-- FIXME enable for mobile, using a Capacitor plugin ? -->
        @if (!mobile) {
          <ion-button (click)="print()">
            <!-- Print button -->
            <ion-icon name="print"></ion-icon>
          </ion-button>
        }

        <!-- share menu -->
        <button mat-icon-button matHeader [title]="'COMMON.SHARE.BTN_SHARE' | translate" [matMenuTriggerFor]="shareMenu">
          <mat-icon>share</mat-icon>
        </button>
      </ion-buttons>
    </app-toolbar>

    <mat-menu #shareMenu="matMenu" xPosition="after">
      <!-- Share popover -->
      <button mat-menu-item (click)="showSharePopover($event)" [disabled]="(loadingSubject | async) || network.offline">
        <ion-label>{{ 'COMMON.SHARE.BTN_SHARE_DOTS' | translate }}</ion-label>
      </button>
    </mat-menu>
  } @else {
    @if (showToolbar) {
      <app-modal-toolbar [modalName]="modalName" [color]="'secondary'" (cancel)="cancel()" [canValidate]="false">
        <ion-title [innerHTML]="$title | async"></ion-title>

        <!-- Print button -->
        <ion-button slot="end" (click)="reveal.print()">
          <ion-icon name="print"></ion-icon>
        </ion-button>

        <!-- Close button (on desktop screen) -->
        <ion-button hidden-xs hidden-sm hidden-mobile slot="end" (click)="cancel()" (keyup.enter)="cancel()">
          <ion-label translate>COMMON.BTN_CLOSE</ion-label>
        </ion-button>
      </app-modal-toolbar>
    }
  }
}

<ion-content>
  <ion-item *ngIf="error && showError" lines="none">
    <ion-icon color="danger" slot="start" name="alert-circle"></ion-icon>
    <ion-label color="danger" class="error" [innerHTML]="error | translate"></ion-label>
  </ion-item>

  @if (loaded) {
    <app-reveal
      #reveal
      [options]="revealOptions"
      [style.--color-primary]="stats.options.colorPrimary"
      [style.--color-secondary]="stats.options.colorSecondary"
    >
      <observed-location-form-report-component
        [rankOrder]="10"
        [stats]="stats?.reportComponents?.[10]"
        [data]="data"
        [pmfms]="stats.pmfms.observedLocation"
        [parentPageDimensions]="pageDimensions"
        [revealOptions]="revealOptions"
        [i18nContext]="i18nContext"
        [program]="stats.program"
        [strategy]="stats.strategy"
        [isBlankForm]="isBlankForm"
        [logoHeadLeftUrl]="stats.options.urlHeaderLogoLeft"
        [logoHeadRightUrl]="stats.options.urlHeaderLogoRight"
        [isPrintingPDF]="false"
        [displayAttributesLocation]="stats.options.displayAttributes.location"
      ></observed-location-form-report-component>

      <landing-form-report-component
        [rankOrder]="20"
        [stats]="stats?.reportComponents?.[20]"
        [data]="data?.landings"
        [sales]="stats.sales"
        [pmfms]="stats.pmfms.landing"
        [sortingBatchPmfmsByIds]="stats.pmfmsByIds.sortingBatch"
        [parentPageDimensions]="pageDimensions"
        [revealOptions]="revealOptions"
        [i18nContext]="i18nContext"
        [program]="stats.program"
        [strategy]="stats.strategy"
        [isBlankForm]="isBlankForm"
        [logoHeadLeftUrl]="stats.options.urlHeaderLogoLeft"
        [logoHeadRightUrl]="stats.options.urlHeaderLogoRight"
        [isPrintingPDF]="false"
        [limitTipsToShowOnAppendix]="stats.options.maxTipsToGoAppendix"
        [displayAttributesLocation]="stats.options.displayAttributes.location"
        [displayAttributesTaxonGroup]="stats.options.displayAttributes.taxonGroup"
        [landTripDate]="data.endDateTime"
        [landTripLocation]="data.location"
      ></landing-form-report-component>
    </app-reveal>
  } @else {
    <loader-report-chunk></loader-report-chunk>
  }
</ion-content>
