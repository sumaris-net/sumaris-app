<ion-tabs>
  <ion-tab-bar slot="bottom" class="action-bar">
    <ion-tab-button *ngFor="let tab of tabs" [tab]="tab.tab" [selected]="selectedTab === tab.tab">
      <ion-icon [name]="tab.icon"></ion-icon>
      <ion-label>{{ tab.label }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
