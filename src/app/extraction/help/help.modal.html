@if (title || canPrint) {
  <app-modal-toolbar color="light" [title]="title | translate" (cancel)="close($event)">
    @if (content.canGoBack) {
      <ion-button slot="start" class="back-button" (click)="goBack($event, content)" routerDirection="back">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    }
    @if (canPrint) {
      <ion-button slot="end" class="back-button" (click)="content.print()" routerDirection="back">
        <ion-icon slot="icon-only" name="print"></ion-icon>
      </ion-button>
    }
  </app-modal-toolbar>
}

<ion-content class="ion-padding">
  <app-markdown-content
    #content
    [src]="src"
    [data]="data"
    [showError]="showError"
    [debug]="debug"
    [updateRouteLocation]="false"
  ></app-markdown-content>
</ion-content>

<ion-footer hidden-xs hidden-sm hidden-mobile>
  <ion-toolbar>
    <ion-row class="ion-no-padding" nowrap>
      <ion-col></ion-col>
      <ion-col size="auto">
        <ion-button fill="solid" color="tertiary" (click)="close()">{{ 'COMMON.BTN_CLOSE' | translate }}</ion-button>
      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-footer>
